<link rel="preconnect" href="https://fonts.googleapis.com" />

<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Schibsted+Grotesk:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #fbfaf7;
    --surface: #ffffff;
    --surface-2: #f0ede5;
    --ink: #14110d;
    --ink-dim: #4d473f;
    --ink-faint: #847f76;
    --line: rgba(20, 17, 13, 0.14);
    --line-strong: rgba(20, 17, 13, 0.40);
    --chris: #c2410c;
    --theo: #1d4ed8;
    --together: #14110d;
    --display: "Schibsted Grotesk", system-ui, sans-serif;
    --body: "Hanken Grotesk", system-ui, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--body); font-size: 17.6px; font-weight: 400; line-height: 1.5;
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 24px; }

  /* ---------- NAV (solid, with day switcher) ---------- */
  nav { position: sticky; top: 0; z-index: 100; background: var(--surface); border-bottom: 1px solid var(--line-strong); }
  .nav-inner { max-width: 1080px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .brand { font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: 0.14em; }
  .brand span { color: var(--ink-faint); }
  .daynav { display: none; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 100px; }
  nav.scrolled .daynav { display: flex; animation: fadeIn .25s ease; }
  .daybtn { font-family: var(--body); font-size: 13px; font-weight: 600; letter-spacing: 0.03em; border: none; background: transparent; color: var(--ink-dim); padding: 7px 15px; border-radius: 100px; cursor: pointer; transition: all .2s ease; white-space: nowrap; }
  .daybtn:hover { color: var(--ink); }
  .daybtn.active { background: var(--ink); color: #fff; }
  .filters { display: flex; gap: 6px; }
  .filters button { font-family: var(--body); font-size: 13px; font-weight: 600; letter-spacing: 0.04em; background: transparent; color: var(--ink-dim); border: 1px solid var(--line-strong); border-radius: 100px; padding: 7px 15px; cursor: pointer; transition: all .22s ease; }
  .filters button:hover { color: var(--ink); border-color: var(--ink); }
  .filters button.active { color: #fff; background: var(--ink); border-color: var(--ink); }
  .filters button[data-person="chris"].active { background: var(--chris); border-color: var(--chris); }
  .filters button[data-person="theo"].active { background: var(--theo); border-color: var(--theo); }

  /* ---------- HERO ---------- */
  header.hero { padding: 88px 0 44px; }
  .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: 0.28em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 26px; }
  .hero h1 { font-family: var(--display); font-weight: 900; font-size: clamp(66px, 13vw, 168px); line-height: 0.9; letter-spacing: -0.035em; }
  .hero h1 em { font-style: normal; color: var(--chris); }
  .hero .meta-row { display: flex; flex-wrap: wrap; gap: 28px; margin-top: 36px; padding-top: 26px; border-top: 1px solid var(--line); font-size: 14px; color: var(--ink-dim); }
  .hero .meta-row b { color: var(--ink); font-weight: 600; }

  /* ---------- LEGEND ---------- */
  .legend { margin-top: 30px; display: flex; flex-direction: column; gap: 16px; }
  .legend-row { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 22px; }
  .legend-row .lbl { font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-faint); width: 86px; }
  .legend .person { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
  #cat-legend { gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .dot.chris { background: var(--chris); }
  .dot.theo { background: var(--theo); }
  .dot.together { background: var(--together); }
  .cat { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 5px 11px 5px 9px; border: 1px solid var(--line-strong); border-radius: 100px; color: var(--ink); background: var(--surface); white-space: nowrap; }
  .cat svg { width: 15px; height: 15px; flex: none; }

  /* ---------- HERO DAY TABS ---------- */
  .daytabs { display: flex; margin: 46px 0 0; border-bottom: 1px solid var(--line-strong); }
  .daytab { flex: 1; background: transparent; border: none; cursor: pointer; text-align: left; padding: 18px 4px; color: var(--ink-faint); border-bottom: 3px solid transparent; margin-bottom: -1px; transition: color .22s ease, border-color .22s ease; font-family: var(--body); }
  .daytab .d-num { font-family: var(--display); font-weight: 800; font-size: 40px; line-height: 1; color: var(--ink-faint); transition: color .22s ease; }
  .daytab .d-lab { display: block; font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; margin-top: 8px; }
  .daytab.active { color: var(--ink); border-color: var(--ink); }
  .daytab.active .d-num { color: var(--ink); }
  .daytab:hover .d-num { color: var(--ink); }

  /* ---------- DAY HEADING ---------- */
  .day-title { font-family: var(--display); font-weight: 800; font-size: clamp(28px, 5vw, 42px); letter-spacing: -0.02em; margin: 42px 0 4px; }
  .day-sub { font-size: 12px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-faint); }
  .day-note { font-size: 21px; font-weight: 500; line-height: 1.45; color: var(--ink-dim); margin: 22px 0 28px; max-width: 62ch; }
  .day-note b { color: var(--ink); font-weight: 700; }

  /* ---------- SCHEDULE ---------- */
  main { padding-bottom: 110px; }
  .slot { display: grid; grid-template-columns: 104px 1fr; gap: 22px; padding: 22px 0; border-bottom: 1px solid var(--line); animation: rise .5s ease both; }
  .slot-time { font-size: 14px; font-weight: 600; color: var(--ink-dim); padding-top: 4px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .slot-cards { display: grid; gap: 14px; }
  .slot-cards.split { grid-template-columns: 1fr 1fr; }
  .card { border: 1px solid var(--line); border-left-width: 4px; background: var(--surface); padding: 18px 20px; border-radius: 4px; box-shadow: 0 1px 2px rgba(20,17,13,0.05); transition: transform .3s cubic-bezier(.2,.7,.2,1), border-color .3s, box-shadow .3s, opacity .3s; }
  .card:hover { transform: translateY(-3px); border-color: var(--line-strong); box-shadow: 0 12px 28px rgba(20,17,13,0.13); }
  .card .who { font-size: 12px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; margin-bottom: 11px; }
  .card .title { font-family: var(--display); font-weight: 700; font-size: 23px; line-height: 1.14; letter-spacing: -0.015em; margin-bottom: 9px; color: var(--ink); }
  .card .org { color: var(--ink-dim); font-size: 13.5px; margin-bottom: 14px; }
  .card .org b { color: var(--ink); font-weight: 600; }
  .cats { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .stage { font-size: 11.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink); border: 1px solid var(--line-strong); padding: 5px 11px; border-radius: 100px; }
  .card.chris { border-left-color: var(--chris); }
  .card.chris .who { color: var(--chris); }
  .card.theo  { border-left-color: var(--theo); }
  .card.theo .who { color: var(--theo); }
  .card.together { border-left-color: var(--together); background: linear-gradient(180deg, rgba(20,17,13,0.045), rgba(20,17,13,0.012)); }
  .card.together .who { color: var(--together); }
  .card.break { border: 1px dashed var(--line-strong); border-left: 4px dashed var(--line-strong); background: transparent; box-shadow: none; }
  .card.break .title { color: var(--ink-dim); font-size: 19px; margin-bottom: 0; }
  .card.break .bnote { color: var(--ink-faint); font-size: 13.5px; margin-top: 6px; }
  .card.empty { border: 1px dashed var(--line-strong); background: transparent; box-shadow: none; display: flex; align-items: center; min-height: 96px; }
  .card.empty .who { color: var(--theo); margin: 0; }
  .card.empty .free { color: var(--ink-faint); font-family: var(--display); font-size: 18px; margin-left: 12px; }
  .skippable { color: var(--ink-faint); font-size: 12.5px; font-style: italic; }
  body[data-filter="chris"] .card.theo, body[data-filter="theo"] .card.chris { opacity: 0.16; filter: saturate(0); }
  body[data-filter="chris"] .card.theo:hover, body[data-filter="theo"] .card.chris:hover { opacity: 0.5; }

  /* ---------- EXTRAS (collapsible "not in plan") ---------- */
  details.extras { margin-top: 30px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface-2); overflow: hidden; }
  details.extras summary { cursor: pointer; list-style: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 18px 20px; font-family: var(--display); font-weight: 700; font-size: 18px; color: var(--ink); }
  details.extras summary::-webkit-details-marker { display: none; }
  .chev { width: 16px; height: 16px; flex: none; margin-left: auto; transition: transform .2s ease; color: var(--ink-dim); }
  details.extras[open] .chev { transform: rotate(90deg); }
  .x-title { flex-shrink: 0; }
  .x-count { flex-shrink: 0; white-space: nowrap; font-family: var(--body); font-weight: 600; font-size: 13px; letter-spacing: 0.04em; color: var(--ink-faint); text-transform: uppercase; }
  .xbody { padding: 4px 20px 14px; }
  .xgroup { margin: 14px 0 4px; }
  .xgroup h4 { font-size: 11.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 6px; font-weight: 700; }
  .xrow { display: grid; grid-template-columns: 84px 1fr; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .xrow:last-child { border-bottom: none; }
  .xtime { font-size: 13px; font-weight: 600; color: var(--ink-dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .xtitle { font-weight: 600; font-size: 15px; line-height: 1.3; }
  .xmeta { color: var(--ink-faint); font-size: 13px; margin-top: 2px; }
  .xrow.hi { box-shadow: inset 3px 0 0 var(--chris); background: rgba(194,65,12,0.06); border-bottom-color: transparent; border-radius: 0 6px 6px 0; padding: 12px; margin: 3px 0; }
  .hitag { display: inline-block; margin-left: 9px; font-family: var(--body); font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--chris); border: 1px solid var(--chris); border-radius: 100px; padding: 2px 9px; vertical-align: middle; white-space: nowrap; }
  .x-count b { color: var(--chris); font-weight: 700; }

  footer { border-top: 1px solid var(--line-strong); padding: 38px 0 80px; font-size: 12.5px; color: var(--ink-faint); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 16px; }
  footer a { color: var(--ink-dim); text-decoration: none; border-bottom: 1px solid var(--line-strong); }
  footer a:hover { color: var(--ink); }

  /* ---------- BACK TO TOP ---------- */
  #toTop { position: fixed; bottom: 26px; right: 26px; z-index: 200; width: 50px; height: 50px; border-radius: 50%; border: 1px solid var(--ink); background: var(--ink); color: #fff; cursor: pointer; display: grid; place-items: center; opacity: 0; transform: translateY(14px); pointer-events: none; transition: opacity .25s ease, transform .25s ease, background .2s ease, border-color .2s ease; box-shadow: 0 10px 24px rgba(20,17,13,0.28); }
  #toTop svg { width: 20px; height: 20px; }
  #toTop.visible { opacity: 1; transform: none; pointer-events: auto; }
  #toTop:hover { background: var(--chris); border-color: var(--chris); }

  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

  @media (max-width: 720px) {
    body { font-size: 16.5px; }
    .nav-inner { gap: 12px; }
    .daynav { order: 3; width: 100%; justify-content: space-between; }
    .daybtn { flex: 1; text-align: center; }
    .slot { grid-template-columns: 1fr; gap: 10px; }
    .slot-time { padding-top: 0; color: var(--ink); }
    .slot-cards.split { grid-template-columns: 1fr; }
    .hero { padding: 48px 0 32px; }
    .legend-row .lbl { width: auto; }
    .xrow { grid-template-columns: 1fr; gap: 2px; }
    #toTop { bottom: 18px; right: 18px; width: 46px; height: 46px; }
  }
</style>
</head>

function catBadge(cat){ return `<span class="cat">${ICONS[cat]}${LABELS[cat]}</span>`; }
function catsHTML(s){
  if (!s.cats || !s.cats.length) return "";
  return `<div class="cats">${s.cats.map(catBadge).join("")}</div>`;
}
function sessionCard(s, kind){
  if (s.empty){
    return `<div class="card empty theo"><span class="who">Theo</span><span class="free">Free — recap with Chris</span></div>`;
  }
  const label = kind === "together" ? "Together" : kind === "chris" ? "Chris" : "Theo";
  return `
    <div class="card ${kind}">
      <div class="who">${label}</div>
      <div class="title">${s.title}</div>
      ${s.org ? `<div class="org">${s.org}</div>` : ""}
      ${catsHTML(s)}
      <div class="foot">${s.stage ? `<span class="stage">${s.stage}</span>` : ""}</div>
    </div>`;
}

function renderSkipped(d){
  if (!d.skipped || !d.skipped.length) return "";
  const total = d.skipped.reduce((n,g)=>n+g.items.length,0);
  const hiCount = d.skipped.reduce((n,g)=>n+g.items.filter(it=>it.highlight).length,0);
  const groups = d.skipped.map(g => `
    <div class="xgroup">
      <h4>${g.group}</h4>
      ${g.items.map(it => `
        <div class="xrow${it.highlight ? " hi" : ""}">
          <div class="xtime">${it.time}</div>
          <div>
            <div class="xtitle">${it.title}${it.highlight ? '<span class="hitag">Worth a look</span>' : ''}</div>
            <div class="xmeta">${[it.org, it.stage, it.note].filter(Boolean).join(" · ")}</div>
          </div>
        </div>`).join("")}
    </div>`).join("");
  return `
    <details class="extras">
      <summary>
        <span class="x-title">Skipped sessions</span>
        <span class="x-count">${total} sessions${hiCount ? ` · <b>${hiCount} worth a look</b>` : ""}</span>
        <svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l4 4-4 4"/></svg>
      </summary>
      <div class="xbody">${groups}</div>
    </details>`;
}

function render(day){
  const d = DATA[day];
  let html = `<div class="day-sub">${d.sub}</div><h2 class="day-title">${d.title}</h2><p class="day-note">${d.note}</p>`;
  d.slots.forEach((slot, i) => {
    let cards = "", splitClass = "";
    if (slot.together){
      cards = sessionCard(slot.together, "together");
    } else if (slot.breakItem){
      cards = `<div class="card break"><div class="title">${slot.breakItem.title}</div>${slot.breakItem.note ? `<div class="bnote">${slot.breakItem.note}</div>` : ""}</div>`;
    } else {
      splitClass = " split";
      cards = sessionCard(slot.chris, "chris") + sessionCard(slot.theo, "theo");
    }
    html += `
      <div class="slot" style="animation-delay:${i*0.04}s">
        <div class="slot-time">${slot.time}</div>
        <div class="slot-cards${splitClass}">${cards}</div>
      </div>`;
  });
  html += renderSkipped(d);
  document.getElementById("schedule").innerHTML = html;
}

document.getElementById("cat-legend").insertAdjacentHTML("beforeend", Object.keys(LABELS).map(catBadge).join(""));

function setDay(day){
  document.querySelectorAll("[data-day]").forEach(b => b.classList.toggle("active", b.dataset.day === day));
  render(day);
}
document.querySelectorAll("[data-day]").forEach(btn => btn.addEventListener("click", () => setDay(btn.dataset.day)));

document.querySelectorAll(".filters button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filters button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    document.body.dataset.filter = btn.dataset.person;
  });
});

function onScroll(){
  toTop.classList.toggle("visible", window.scrollY > 400);
  navEl.classList.toggle("scrolled", heroTabs.getBoundingClientRect().bottom <= navEl.offsetHeight);
}

window.addEventListener("resize", onScroll);
onScroll();
